<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Table Tennis</title>
    <link rel="preload" href="/fonts/SFCartoonistHand-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/SFCartoonistHand.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <canvas id="game" aria-label="Table tennis game"></canvas>

    <!-- Top-right controls -->
    <div id="controls" class="controls" hidden>
      <span id="btn-mode" class="chip chip-static" title="Difficulty is locked for this match">
        <span id="mode-label">Medium</span>
      </span>
      <button id="btn-conn" class="chip" type="button" data-testid="connection" hidden title="Connection">
        <span id="conn-bars" aria-hidden="true">▮▮▮</span>
        <span id="conn-ping"></span>
      </button>
      <button id="btn-mute" class="chip chip-icon" type="button" title="Mute (M)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
          <path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path class="wave" d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path class="mute-x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button id="btn-leave" class="chip chip-icon" type="button" data-testid="leave-match" hidden title="Leave">×</button>
    </div>

    <!-- Start / difficulty screen -->
    <div id="overlay-start" class="overlay">
      <div class="card">
        <div class="card-art" aria-hidden="true">
          <canvas id="card-art" width="170" height="120"></canvas>
        </div>
        <h1>Table Tennis</h1>
        <p class="sub">You vs <span id="start-opponent">Bot</span> · first to <span id="start-score">11</span>, win by 2</p>
        <div class="modes" role="group" aria-label="Difficulty">
          <button class="mode" data-mode="easy" type="button">
            <span class="mode-name">Easy</span>
          </button>
          <button class="mode" data-mode="medium" type="button">
            <span class="mode-name">Medium</span>
          </button>
          <button class="mode" data-mode="hard" type="button">
            <span class="mode-name">Hard</span>
          </button>
        </div>
        <div id="mp-entry" hidden>
          <p id="mp-divider" class="hint" data-testid="mp-divider"></p>
          <div class="actions">
            <button id="btn-host" class="btn" type="button" data-testid="host-game"></button>
            <button id="btn-join" class="btn" type="button" data-testid="join-code"></button>
          </div>
          <p class="hint"><span id="mp-playing-as"></span> <button id="btn-name" class="btn" type="button" data-testid="player-name"></button></p>
        </div>
        <p class="info-badge">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2" />
            <circle cx="12" cy="7.6" r="1.4" fill="currentColor" />
            <path d="M12 11v6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          </svg>
          <span id="start-hint">Arrow keys or drag to move · Space to serve</span>
        </p>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="overlay-over" class="overlay" hidden>
      <div class="card">
        <h1 id="over-title">You win!</h1>
        <p class="sub" id="over-score">11 · 7</p>
        <div class="actions">
          <button id="btn-again" class="btn primary" type="button">Play again</button>
          <button id="btn-change" class="btn" type="button">Change difficulty</button>
        </div>
        <p class="hint" id="over-hint">Space or tap to play again</p>
      </div>
    </div>

    <div id="mp-root" hidden></div>

    <!-- Footer pill -->
    <footer class="footer">
      <nav class="pill" aria-label="Links">
        <a id="footer-instagram" href="#" target="_blank" rel="noopener">Instagram</a>
        <a id="footer-x" href="#" target="_blank" rel="noopener">X</a>
        <a id="footer-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

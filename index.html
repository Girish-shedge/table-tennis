<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Table Tennis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game" aria-label="Table tennis game"></canvas>

    <!-- Top-right controls -->
    <div id="controls" class="controls" hidden>
      <button id="btn-mode" class="chip" type="button" title="Change difficulty">
        <span id="mode-label">Medium</span>
      </button>
      <button id="btn-mute" class="chip chip-icon" type="button" title="Mute (M)" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
          <path class="wave" d="M16 8.5a4.5 4.5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path class="wave" d="M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path class="mute-x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Start / difficulty screen -->
    <div id="overlay-start" class="overlay">
      <div class="card">
        <div class="card-art" aria-hidden="true">
          <canvas id="card-art" width="140" height="110"></canvas>
        </div>
        <h1>Table Tennis</h1>
        <p class="sub">You vs <span id="start-opponent">Bot</span> · first to <span id="start-score">11</span>, win by 2</p>
        <div class="modes" role="group" aria-label="Difficulty">
          <button class="mode" data-mode="easy" type="button">
            <span class="mode-name">Easy</span>
            <span class="mode-desc">Slow and forgiving</span>
          </button>
          <button class="mode" data-mode="medium" type="button">
            <span class="mode-name">Medium</span>
            <span class="mode-desc">A fair rally</span>
          </button>
          <button class="mode" data-mode="hard" type="button">
            <span class="mode-name">Hard</span>
            <span class="mode-desc">Fast and sharp</span>
          </button>
        </div>
        <p class="hint" id="start-hint">Arrow keys or drag to move · Space to serve</p>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="overlay-over" class="overlay" hidden>
      <div class="card">
        <h1 id="over-title">You win!</h1>
        <p class="sub" id="over-score">11 · 7</p>
        <div class="actions">
          <button id="btn-again" class="btn primary" type="button">Play again</button>
          <button id="btn-change" class="btn" type="button">Change difficulty</button>
        </div>
        <p class="hint" id="over-hint">Space or tap to play again</p>
      </div>
    </div>

    <!-- Footer pill -->
    <footer class="footer">
      <nav class="pill" aria-label="Links">
        <a id="footer-instagram" href="#" target="_blank" rel="noopener">Instagram</a>
        <a id="footer-x" href="#" target="_blank" rel="noopener">X</a>
        <a id="footer-linkedin" href="#" target="_blank" rel="noopener">LinkedIn</a>
      </nav>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
